<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">Code mark</title>
  <desc id="desc">Purple terminal tile with angle brackets and slash representing code</desc>
  <defs>
    <linearGradient id="tile" x1="7" y1="5" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="glyph" x1="10" y1="14" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" flood-color="#4c1d95" flood-opacity=".28" stdDeviation="2"/>
    </filter>
  </defs>
  <rect x="3" y="3" width="42" height="42" rx="11" fill="url(#tile)" filter="url(#shadow)"/>
  <path d="M3 14h42" opacity=".18" stroke="#fff"/>
  <circle cx="10" cy="9" r="1.4" fill="#c4b5fd"/>
  <circle cx="15" cy="9" r="1.4" fill="#a78bfa" opacity=".75"/>
  <path d="M18 18 11 24l7 6M30 18l7 6-7 6M28 14l-8 20" fill="none" stroke="url(#glyph)" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2"/>
  <circle cx="38" cy="39" r="1.8" fill="#a78bfa"/>
</svg>
